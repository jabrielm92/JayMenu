services:
  db:
    image: postgres:16-alpine
    container_name: jaymenu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jaymenu
      POSTGRES_PASSWORD: jaymenu
      POSTGRES_DB: jaymenu
    ports:
      - "5432:5432"
    volumes:
      - jaymenu-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaymenu -d jaymenu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jaymenu-pgdata:
